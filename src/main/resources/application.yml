server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/learn_recommend?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: "0527"   # 纯数字也加双引号，避免被当成八进制
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      url: redis://localhost:6379
      # 如果Redis有密码，则使用：redis://:password@localhost:6379
      timeout: 200ms
      lettuce:
        shutdown-timeout: 200ms
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 100ms
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    # 消息可靠性投递配置
    publisher-confirm-type: correlated
    publisher-returns: true

#推荐系统配置
recommend:
  mode: async
logging :
    level:
        com.example.bishe: ${LOG_LEVEL:info}
        #Spring线程池初始化细节
        org.springframework.web: ${SPRING_WEB_LOG_LEVEL:info}
knife4j:
  enable: true
  setting:
    enable-auth: true
    enable-footer: false
    enable-request-header-token: true

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  type-aliases-package: com.example.bishe.entity
  mapper-locations: classpath*:/mapper/**/*.xml